name: Cloud Poodll Recording Question
summary: A question type where students answer by recording audio or video, or drawing on a whiteboard.
description: |
  Cloud Poodll adds a question type to the Moodle question bank, so it works in quizzes anywhere a
  standard question would. Students record their response directly in the browser, and the
  recording is stored in the Cloud Poodll cloud rather than on the Moodle server.

  Like an Essay question, responses are graded manually by a teacher, with the recording and,
  optionally, its transcript shown alongside for grading.

  **Requires a Cloud Poodll account.** Recording, conversion and storage run through the Cloud
  Poodll service, so the plugin needs an API user and secret from https://poodll.com to function.
labels:
  - paid-service
  - external-account
  - commercial-support-available
category: question-type
